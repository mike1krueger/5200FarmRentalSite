<!DOCTYPE html><html lang=en><head><title>Amenities · Old Quarter Barn</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@400;500&family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header><nav><a href="index.html" class="">Home</a><a href="amenities.html" class="cur">Amenities</a><a href="index.html#gallery">Gallery</a></nav>
<div class="brand"><b>Old Quarter Barn</b><span>Upperco &middot; Maryland</span></div>
<nav><a href="index.html#pricing">Pricing</a><a href="index.html#visit">Contact</a></nav></header>
<section class="pagehead"><small>The Property</small><h1>Amenities</h1><div class="rule"></div><p>Select an amenity to see photos and details.</p></section>
<section class="list" id="list"></section>
<section class="dark deep" style="padding:12vh 5vw"><div class="rule"></div><h2 style="margin-bottom:28px">Interested in renting?</h2><a class="btn" style="background:none" href="index.html#visit">Contact</a></section>
<footer>Old Quarter Barn · 5200 Old Quarter Road, Upperco, MD 21155</footer>
<div id="ov"><div class="pic"><img id="pimg" alt=""><button class="arr" style="left:40px" id="prev" aria-label="Previous">&#8249;</button><button class="arr r" style="right:40px" id="next" aria-label="Next">&#8250;</button><div class="dots" id="dots"></div></div>
<div class="txt"><h2 id="ttl"></h2><div class="rule" style="margin:0 0 28px"></div><div id="body"></div><a class="btn" href="index.html#visit">Contact</a></div></div>
<button id="close">Close &times;</button>
<script>
var D=[
{name:'The Barn',pics:['media/aerial.jpg','media/interior.jpg','media/barn.jpg'],long:['A timber frame barn with two stalls, set at the center of the property.','Your horses are kept under cover and close to the ring and field, so everything you need each day is within a short walk.','A tack room keeps saddles and gear organized, and there is ample storage throughout, including a loft for hay and supplies.']},
{name:'The Riding Ring',pics:['media/rider.jpg','media/ring.jpg'],long:['A full-size dressage ring, 197 by 66 feet (60 by 20 meters), for your exclusive use.','Schedule your own lessons, schooling and training without waiting for a turn or sharing the space with other riders.','The ring sits beside the barn and field, so tacking up, riding and cooling out all happen within a few steps.']},
{name:'The Open Field',pics:['media/fence.jpg'],long:['An open field of about 6 acres, enclosed by traditional three-board oak fencing.','The pasture is well established, with thick, healthy grass that holds up to grazing and riding.','Use it for turnout, conditioning work or simply extra space around the barn and ring.']}];
var o=-1,s=0,$=function(i){return document.getElementById(i)};
$('list').innerHTML=D.map(function(d,i){return '<button data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span class="nm">'+d.name+'</span><span class="v">View</span></button>'}).join('');
function draw(){var d=D[o],m=d.pics.length>1?'':'none';$('prev').style.display=$('next').style.display=$('dots').style.display=m;$('ttl').textContent=d.name;$('body').innerHTML=d.long.map(function(p){return '<p>'+p+'</p>'}).join('');$('pimg').src=d.pics[s];$('pimg').alt=d.name;
$('dots').innerHTML=d.pics.map(function(_,i){return '<i data-s="'+i+'" style="width:'+(i==s?48:28)+'px;opacity:'+(i==s?1:.4)+'"></i>'}).join('')}
function open_(i){o=i;s=0;draw();$('ov').classList.add('open');document.body.style.overflow='hidden'}
function close_(){o=-1;$('ov').classList.remove('open');document.body.style.overflow=''}
function step(d){if(o<0)return;var n=D[o].pics.length;s=(s+d+n)%n;draw()}
$('list').onclick=function(e){var b=e.target.closest('button');if(b)open_(+b.dataset.i)};
$('dots').onclick=function(e){if(e.target.dataset.s){s=+e.target.dataset.s;draw()}};
$('prev').onclick=function(){step(-1)};$('next').onclick=function(){step(1)};$('close').onclick=close_;
document.addEventListener('keydown',function(e){if(e.key=='Escape')close_();if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)});
</script></body></html>
