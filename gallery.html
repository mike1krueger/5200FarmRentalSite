<script>
var P=[{"p": "exterior-1.jpg", "l": "Barn from above, front", "c": "Barn Exterior"}, {"p": "fence.jpg", "l": "Fence line and field", "c": "Pasture"}, {"p": "exterior-2.jpg", "l": "Barn from above, side", "c": "Barn Exterior"}, {"p": "aerial-new.jpg", "l": "Barn and ring from above", "c": "Barn Exterior|Ring"}, {"p": "interior-1.jpg", "l": "Barn entry and staircase", "c": "Barn Interior"}, {"p": "interior-2.jpg", "l": "Wash stall and sink area", "c": "Barn Interior"}, {"p": "interior-3.jpg", "l": "Stalls", "c": "Barn Interior"}, {"p": "interior-4.jpg", "l": "Stall and fans", "c": "Barn Interior"}, {"p": "interior-5.jpg", "l": "Hayloft", "c": "Barn Interior"}, {"p": "interior-6.jpg", "l": "Barn aisle", "c": "Barn Interior"}, {"p": "ring-new.jpg", "l": "Riding ring from above", "c": "Ring"}, {"p": "rider.jpg", "l": "Rider in the ring", "c": "Riding"}, {"p": "ride-canter.jpg", "l": "Cantering along the fence", "c": "Riding"}, {"p": "ride-jump.jpg", "l": "Approaching a jump", "c": "Riding"}, {"p": "ride-jump2.jpg", "l": "Over the jump", "c": "Riding"}],cat='All',sel=-1,$=function(i){return document.getElementById(i)};
function order(){var f=[];P.forEach(function(p,i){if(cat=='All'||('|'+p.c+'|').indexOf('|'+cat+'|')>=0)f.push(i)});return f}
function show(){var o=sel>=0;$('lb').classList.toggle('open',o);if(o)$('lbimg').style.backgroundImage='url(media/'+P[sel].p+')'}
function step(d){if(sel<0)return;var o=order();if(o.indexOf(sel)<0)o=P.map(function(_,i){return i});var k=o.indexOf(sel);sel=o[(k+d+o.length)%o.length];show()}
document.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){cat=b.dataset.c;document.querySelectorAll('.cat').forEach(function(x){x.classList.toggle('on',x==b)});document.querySelectorAll('.tile').forEach(function(t){t.style.display=(cat=='All'||('|'+t.dataset.c+'|').indexOf('|'+cat+'|')>=0)?'':'none'})}});
document.querySelectorAll('.tile,.ghero').forEach(function(t){t.onclick=function(){sel=+t.dataset.i;show()}});
$('lbp').onclick=function(e){e.stopPropagation();step(-1)};$('lbx2').onclick=function(e){e.stopPropagation();step(1)};
$('lbc').onclick=function(){sel=-1;show()};$('lb').onclick=function(e){if(e.target.id!='lbimg'){sel=-1;show()}};
document.addEventListener('keydown',function(e){if(sel<0)return;if(e.key=='Escape'){sel=-1;show()}if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)});
</script></body></html>
